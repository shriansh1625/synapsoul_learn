services:
  - type: web
    name: learnlab-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnlab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
  - type: pserv
    name: learnlab-db
    runtime: postgresql
    plan: free
